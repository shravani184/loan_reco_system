# Render Blueprint - Personalised Loan Recommendation System (backend)
# Deploys the FastAPI backend straight from GitHub. The model artifacts and loan
# catalogue are committed to the repo (see README) so a git-only deploy runs the
# ML pipeline, not DETERMINISTIC_FALLBACK.
#
# Docs: https://render.com/docs/blueprint-spec
#
# To use: connect this repo to Render (a `render.yaml` on any branch is enough,
# no Dockerfile required). Secrets below with `sync: false` are set once from the
# dashboard after the first deploy.

services:
  - type: web
    name: plrs-backend
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      # Runtime service configuration.
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173
      - key: LOG_LEVEL
        value: INFO
      - key: ENABLE_XAI_ENDPOINT
        value: "true"
      - key: PERSONALIZATION_DB_URL
        value: sqlite:///data/personalization.db
      # Version stamps (must match the committed model manifests at load time).
      - key: CONFIG_VERSION
        value: 2.0.0
      - key: FEATURE_VERSION
        value: 2.0.0
      - key: PROMPT_VERSION
        value: 2.0.0
      - key: LABELING_POLICY_VERSION
        value: 2.0.0
      # Artifact paths are relative to the repo root (the working directory).
      - key: RISK_MODEL_PATH
        value: models/risk_model.json
      - key: RECOMMENDER_MODEL_PATH
        value: models/loan_recommender.json
      - key: CALIBRATION_KNOTS_PATH
        value: models/loan_recommender_calibration.json
      - key: ENCODER_MAPPING_PATH
        value: models/loan_recommender_encoders.json
      - key: LOAN_CATALOGUE_PATH
        value: data/loan_products.csv
      # LLM (explanation only). LLM_MODEL keeps the Groq model id used at request
      # time; LLM_API_KEY is a secret and must be set in the dashboard.
      - key: LLM_API_ENDPOINT
        value: https://api.groq.com/openai/v1/chat/completions
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: LLM_API_KEY
        sync: false
